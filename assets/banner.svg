<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#11151c"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="brandBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="50%" stop-color="#D29922"/>
      <stop offset="100%" stop-color="#2EA043"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D29922" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#D29922" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- ambient glow behind orchestrator hub -->
  <circle cx="600" cy="140" r="120" fill="url(#hubGlow)"/>

  <!-- background spine -->
  <path d="M 110,140 L 1090,140" stroke="#30363d" stroke-width="1.4" stroke-dasharray="2 6" opacity="0.5"/>
  <!-- animated data flow -->
  <path d="M 110,140 L 1090,140" stroke="#58a6ff" stroke-width="1.6" stroke-dasharray="6 14" opacity="0.55">
    <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- left: raw data sources -->
  <g stroke="#30363d" stroke-width="1.2">
    <line x1="70" y1="80" x2="255" y2="138"/>
    <line x1="70" y1="140" x2="255" y2="140"/>
    <line x1="70" y1="200" x2="255" y2="142"/>
  </g>
  <circle cx="70" cy="80" r="5" fill="#8b949e"/>
  <circle cx="70" cy="140" r="5" fill="#8b949e"/>
  <circle cx="70" cy="200" r="5" fill="#8b949e"/>

  <!-- ingestion / lakehouse node -->
  <circle cx="260" cy="140" r="22" fill="none" stroke="#1F6FEB" stroke-width="1.5" opacity="0.4"/>
  <circle cx="260" cy="140" r="13" fill="#1F6FEB"/>

  <!-- hub spokes to sub-agent tasks -->
  <g stroke="#30363d" stroke-width="1.2">
    <line x1="600" y1="140" x2="540" y2="62"/>
    <line x1="600" y1="140" x2="540" y2="218"/>
    <line x1="600" y1="140" x2="660" y2="62"/>
    <line x1="600" y1="140" x2="660" y2="218"/>
  </g>
  <circle cx="540" cy="62" r="7" fill="#2EA043"/>
  <circle cx="540" cy="218" r="7" fill="#2EA043"/>
  <circle cx="660" cy="62" r="7" fill="#2EA043"/>
  <circle cx="660" cy="218" r="7" fill="#2EA043"/>

  <!-- orchestrator / agent core -->
  <polygon points="600,108 631,124 631,156 600,172 569,156 569,124"
           fill="#D29922" stroke="#f0b94d" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" from="0 600 140" to="360 600 140" dur="50s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="600" cy="140" r="9" fill="#0d1117"/>

  <!-- output / insight node -->
  <circle cx="940" cy="140" r="22" fill="none" stroke="#2EA043" stroke-width="1.5" opacity="0.4"/>
  <circle cx="940" cy="140" r="13" fill="#2EA043"/>

  <!-- right: deliverables -->
  <g stroke="#30363d" stroke-width="1.2">
    <line x1="945" y1="138" x2="1130" y2="80"/>
    <line x1="945" y1="140" x2="1130" y2="140"/>
    <line x1="945" y1="142" x2="1130" y2="200"/>
  </g>
  <circle cx="1130" cy="80" r="5" fill="#8b949e"/>
  <circle cx="1130" cy="140" r="5" fill="#8b949e"/>
  <circle cx="1130" cy="200" r="5" fill="#8b949e"/>

  <!-- tagline -->
  <text x="600" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15" letter-spacing="3" fill="#c9d1d9" opacity="0.6">
    WHERE DATA MEETS AUTONOMOUS INTELLIGENCE
  </text>

  <!-- brand strip -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#brandBar)"/>
</svg>
